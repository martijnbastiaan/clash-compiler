name: Kloonbot

on: issue_comment

# The run_ci command pushes a branch to origin: it needs contents write.
# The run_benchmark command dispatches benchmark-pr.yml: it needs actions
# write.
permissions:
  contents: write
  actions: write

jobs:
  kloonbot:
    name: Clone branch to local branch
    runs-on: ubuntu-latest
    if: ${{ github.event.issue.pull_request }}

    env:
      KBOT_AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
      KBOT_COMMENT: ${{ github.event.comment.body }}
      KBOT_PULL_REQUEST_URL: ${{ github.event.issue.pull_request.url }}
      KBOT_PR_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - run: |
          ./.ci/kloonbot.sh
